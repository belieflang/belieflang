[workspace]
members = [
    "crates/bel-syntax",
    "crates/bel-runtime",
    "crates/bel-providers",
    "crates/bel-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1-alpha"
edition = "2021"
authors = ["BeliefLang Contributors"]
license = "Apache-2.0"
repository = "https://github.com/belieflang/belieflang"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
indexmap = { version = "2.6", features = ["serde"] }
