name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag to publish to (e.g. next, latest)'
        required: true
        default: 'next'
      dry_run:
        description: 'Dry run build and validation without publishing'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            binary: target/aarch64-apple-darwin/release/bel
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-14
            binary: target/x86_64-apple-darwin/release/bel
            smoke: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: target/x86_64-unknown-linux-musl/release/bel
            smoke: true
            setup_musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            binary: target/aarch64-unknown-linux-musl/release/bel
            smoke: true
            setup_musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: target/x86_64-pc-windows-msvc/release/bel.exe
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install musl-tools (Linux)
        if: matrix.setup_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p bel-cli

      - name: Smoke test binary
        if: matrix.smoke
        run: node scripts/release/smoke-test.mjs --bin ${{ matrix.binary }}

      - name: Package release archive
        run: |
          mkdir -p release-artifacts
          node scripts/release/package-binary.mjs --target ${{ matrix.target }} --bin ${{ matrix.binary }} --out release-artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error

  validate:
    name: Validate Release Packages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-download
          pattern: release-artifacts-*
          merge-multiple: true

      - name: Organize artifacts
        run: |
          mkdir -p release-artifacts
          cp -r artifacts-download/* release-artifacts/
          ls -la release-artifacts

      - name: Verify SHA-256 Checksums
        run: |
          cd release-artifacts
          for f in *.sha256; do
            echo "Verifying $f..."
            sha256sum -c "$f"
          done

      - name: Check version consistency
        run: node scripts/release/version.mjs check

      - name: Stage and pack npm distribution
        run: |
          node scripts/release/stage-npm.mjs --artifacts release-artifacts --out npm-dist

      - name: Test npm launcher against local linux-x64 package
        run: |
          mkdir -p /tmp/npm-test-consumer
          cd /tmp/npm-test-consumer
          echo '{"name":"test-consumer","version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund \
            $GITHUB_WORKSPACE/npm-dist/tarballs/belieflang-cli-linux-x64-*.tgz \
            $GITHUB_WORKSPACE/npm-dist/tarballs/belieflang-*.tgz
          ./node_modules/.bin/bel --version
          ./node_modules/.bin/bel run $GITHUB_WORKSPACE/examples/intent.bel --trace

      - name: Generate release notes
        run: |
          node scripts/release/generate-release-notes.mjs --artifacts release-artifacts --out RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-artifacts
          path: release-artifacts/
          if-no-files-found: error

      - name: Upload staged npm packages
        uses: actions/upload-artifact@v4
        with:
          name: staged-npm-packages
          path: npm-dist/tarballs/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    name: Publish Release (Requires Approval)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.dry_run != 'true'
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-release-artifacts
          path: release-artifacts

      - name: Download staged npm packages
        uses: actions/download-artifact@v4
        with:
          name: staged-npm-packages
          path: npm-tarballs

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      # Authenticate to crates.io via OIDC or fallback to secret token
      - name: Authenticate to crates.io (OIDC)
        continue-on-error: true
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Crates to crates.io
        run: node scripts/release/publish-crates.mjs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

      # Publish packages to npm
      - name: Publish npm packages
        run: node scripts/release/publish-npm.mjs --tarballs npm-tarballs --tag ${{ github.event.inputs.npm_tag || 'next' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Release
      - name: Create GitHub Release
        run: |
          VERSION=$(node scripts/release/version.mjs print)
          TAG="v$VERSION"
          IS_PRERELEASE=$(node --input-type=module -e "import { isPrerelease } from './scripts/release/lib.mjs'; console.log(isPrerelease('$VERSION'))")

          EXTRA_FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi

          gh release create "$TAG" release-artifacts/* \
            --title "BeliefLang $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $EXTRA_FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
